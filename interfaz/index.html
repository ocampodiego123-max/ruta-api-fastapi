<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de equipos</title>
</head>
<link rel="stylesheet" href="estilos.css">

<body>
    <h1>Gestión de equipos</h1>
    <p>Administra los equipos registrados.</p>
    <button type="button" id="boton-prueba">Probar JavaScript</button>
    <p id="resultado">resultado</p>

<div class="formulario-equipo">
    <form id="formulario-equipo">
        <label for="nombre">Nombre del equipo:</label>
        <input type="text" id="nombre" required>

        <label for="tipo">Tipo de equipo:</label>
        <input type="text" id="tipo" required>
        
        <label for="estado">Estado:</label>

        <select id="estado" required>
        <option value="activo">Activo</option>
        <option value="en mantenimiento">En mantenimiento</option>
        <option value="fuera de servicio">Fuera de servicio</option>
    </select>

        <button type="submit">Registrar equipo</button>

    </form>     
</div>

<section>
    <h2>Inventario de equipos</h2>
    <p>Aquí mostraremos los equipos registrados.</p>
    <div id="lista-equipos"></div>

</section>

<section>
    <h2>Publicación de prueba</h2>
    <p id="titulo-publicacion">Esperando datos...</p>
</section>

<script src="script.js" ></script>

</body>
</html>
